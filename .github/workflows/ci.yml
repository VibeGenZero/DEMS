# CI for DEMS on GitHub Actions: tests on every run, a Docker image check where it matters,
# and the image on Docker Hub from main (edge) and from tags (releases).
# Job details: docs/wiki/ops/ci.md

name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# A new commit cancels the older run of the same branch or PR.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: moritakahashi/dems

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The document store contract tests also run against a real PostgreSQL
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dems
          POSTGRES_PASSWORD: dems
          POSTGRES_DB: dems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dems -d dems_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://dems:dems@localhost:5432/dems_test
    steps:
      - uses: actions/checkout@v7
      # Same Node major as the Dockerfile. The runner image ships python3, make and g++,
      # which npm's implicit node-gyp step for better-sqlite3 needs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Always on main, tags and manual runs; in a PR only when Docker or package files change.
      - name: Check whether the image is affected
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|package\.json|package-lock\.json|compose[^/]*\.yaml|db/.*)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Docker or package files changed, skipping the image build."
          fi
      - name: Build runtime and dev images
        if: steps.scope.outputs.run == 'true'
        run: |
          docker build --target runtime --tag dems:ci .
          docker build --target dev --tag dems:ci-dev .
      # Start compose.yaml (password init, PostgreSQL, DEMS) without any .env, as a
      # fresh installation does (#138), and wait for the DEMS HEALTHCHECK (GET /healthz);
      # production refuses to run without PostgreSQL.
      - name: Wait for the runtime healthcheck
        if: steps.scope.outputs.run == 'true'
        run: |
          rm -f .env
          docker compose -f compose.yaml -f compose.build.yaml up --detach --build
          container=$(docker compose -f compose.yaml -f compose.build.yaml ps -q dems)
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            echo "health: $status"
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 3
          done
          docker compose -f compose.yaml -f compose.build.yaml logs
          exit 1
      # A fresh installation answers in setup mode and prints its setup PIN (#138)
      - name: Check the setup mode of a fresh installation
        if: steps.scope.outputs.run == 'true'
        run: |
          status=$(curl --silent --show-error http://localhost:3000/api/setup/status)
          echo "$status"
          echo "$status" | grep -q '"required":true'
          docker compose -f compose.yaml -f compose.build.yaml logs dems | grep -q 'Setup-PIN: [0-9]\{8\}'

  # Pushes the image to Docker Hub once tests and the image check are green.
  # main -> edge + edge-<commit> (test environment only); tag X -> X + sha-<commit> +
  # latest (release) or beta (pre-release), plus the GitHub release from updates.json.
  publish:
    needs: [test, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # A tag must match package.json, package-lock.json and updates.json
      - name: Choose the image tags
        id: meta
        run: |
          short="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node scripts/release.js check "$GITHUB_REF_NAME"
            version="$GITHUB_REF_NAME"
            channel=$(node scripts/release.js channel "$version")
            tags="$IMAGE:$version,$IMAGE:sha-$short,$IMAGE:$channel"
          else
            # Own commit tag: the tag run of the same commit pushes the release commit tag in parallel
            version=edge
            channel=edge
            tags="$IMAGE:edge,$IMAGE:edge-$short"
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "tags=$tags"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: $tags"
      # Forks and repositories without the secrets skip the upload, they do not fail
      - name: Check the Docker Hub secrets
        id: secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::notice::DOCKERHUB_TOKEN fehlt, das Image wird nicht hochgeladen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: docker/login-action@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the image
        if: steps.secrets.outputs.ok == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            DEMS_CHANNEL=${{ steps.meta.outputs.channel }}
            DEMS_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/VibeGenZero/DEMS
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create the GitHub release
        if: steps.secrets.outputs.ok == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists already, left untouched."
            exit 0
          fi
          node scripts/release.js notes "$TAG" > notes.md
          if [ "$CHANNEL" = beta ]; then flag=--prerelease; else flag=--latest; fi
          gh release create "$TAG" --verify-tag --title "DEMS $TAG" --notes-file notes.md "$flag"
