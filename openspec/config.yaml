schema: spec-driven

context: |
  DEMS: Node >= 22, Express 5 API + static ES-module SPA + discord.js bot in one process. No build step, no TypeScript.
  Write all OpenSpec artifacts in English; everything users see (UI, API error messages, Discord messages) is German.
  Read docs/wiki/index.md and the 1-3 wiki nodes the change touches instead of exploring the code; follow CLAUDE.md rules.
  Data access only through firebaseAdmin.js (Firestore-style API, ISO date strings, filter/sort in memory, no limit).
  Strict CSP: no inline scripts, handlers or styles; no CDNs; styles only via tokens from public/css/tokens.css.
  No new dependencies without a clear reason.

rules:
  proposal:
    - Name the affected wiki nodes (docs/wiki/...) and the ticket (F-xx/D-xx) if there is one
  design:
    - Mention required Discord helpers in bot.js plus their twin in dev/mockBot.js when the bot is touched
    - New env variables must be listed for .env.example and docs/wiki/ops/configuration.md
  tasks:
    - Test first (node:test + node:assert/strict); server behaviour via test/devServer.test.js personas
    - Include a task to update the affected wiki nodes and run npm run wiki
    - End with npm test (and npm run test:e2e for UI changes)

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
