# CI for DEMS: tests on every pipeline, a Docker image check where it matters.
# Runner setup and job details: docs/wiki/ops/ci.md

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # A branch with an open MR already gets the MR pipeline; skip the duplicate.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

stages:
  - test
  - build

test:
  stage: test
  # Same Node major as the Dockerfile. The full (non-slim) image ships python3, make
  # and g++, which npm's implicit node-gyp step for better-sqlite3 needs.
  image: node:24-bookworm
  # The document store contract tests also run against a real PostgreSQL
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
    POSTGRES_USER: dems
    POSTGRES_PASSWORD: dems
    POSTGRES_DB: dems_test
    TEST_DATABASE_URL: postgres://dems:dems@postgres:5432/dems_test
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - node --version
    - npm --version
    - npm ci --no-audit --no-fund
    - npm test

docker-build:
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  # Only the privileged "dems-docker" runner takes jobs with this tag.
  tags:
    - docker
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - Dockerfile
        - .dockerignore
        - package.json
        - package-lock.json
        - compose*.yaml
        - db/**/*
    # Rules match in order; a bare "never" must come last or it swallows the rest.
    - when: never
  script:
    - docker build --target runtime --tag dems:ci .
    - docker build --target dev --tag dems:ci-dev .
    # Start compose.yaml (password init, PostgreSQL, DEMS) and wait for the DEMS
    # HEALTHCHECK (GET /healthz); production refuses to run without PostgreSQL.
    - printf 'SESSION_SECRET=ci-only-secret\n' > .env
    - docker compose -f compose.yaml up --detach --build
    - |
      container=$(docker compose -f compose.yaml ps -q dems)
      for i in $(seq 1 40); do
        status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
        echo "health: $status"
        if [ "$status" = healthy ]; then exit 0; fi
        if [ "$status" = unhealthy ]; then break; fi
        sleep 3
      done
      docker compose -f compose.yaml logs
      exit 1
